<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AminoSense — Amino Acid Biosensing</title>
<link rel="icon" type="image/png" href="Icon.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --purple: #4B3F73;
  --crimson: #B20834;
  --gold: #F2C94C;
  --white: #FFFFFF;
  --text-muted: #6B6280;
}

body {
  font-family: 'Segoe UI Semilight', 'Segoe UI', system-ui, sans-serif;
  color: var(--purple);
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Full-screen hero with background image */
.hero {
  min-height: 100vh;
  background: url('BG.png') center right / cover no-repeat;
  background-color: #e8e8ec;
  display: flex;
  align-items: center;
  padding: 80px 8vw;
  position: relative;
}

/* Gradient overlay so text is readable over any part of the image */
.hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    rgba(255,255,255,0.95) 0%,
    rgba(255,255,255,0.85) 30%,
    rgba(255,255,255,0.4) 55%,
    transparent 70%
  );
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 540px;
}

.logo {
  margin-bottom: 48px;
  animation: fadeUp 0.8s ease both;
}
.logo img {
  height: auto;
  width: 340px;
}

h1 {
  font-family: 'Segoe UI Semilight', 'Segoe UI', system-ui, sans-serif;
  font-weight: 300;
  font-size: clamp(32px, 4.5vw, 52px);
  line-height: 1.15;
  color: var(--purple);
  margin-bottom: 20px;
  animation: fadeUp 0.8s 0.1s ease both;
}
h1 em {
  font-style: italic;
  color: var(--crimson);
}

.subtitle {
  font-size: 17px;
  line-height: 1.65;
  color: var(--text-muted);
  margin-bottom: 36px;
  max-width: 440px;
  animation: fadeUp 0.8s 0.2s ease both;
}

.cta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 48px;
  animation: fadeUp 0.8s 0.3s ease both;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 32px;
  border-radius: 8px;
  font-family: 'Segoe UI Semibold', 'Segoe UI', system-ui, sans-serif;
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  transition: all 0.25s;
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: var(--crimson);
  color: var(--white);
}
.btn-primary:hover {
  background: #8f062a;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(178,8,52,0.2);
}
.btn-portal {
  background: var(--purple);
  color: var(--white);
}
.btn-portal:hover {
  background: #3a3160;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(75,63,115,0.2);
}

.ruo {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  font-family: 'Segoe UI Semibold', 'Segoe UI', system-ui, sans-serif;
  font-weight: 600;
  color: var(--crimson);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: rgba(178,8,52,0.06);
  padding: 5px 14px;
  border-radius: 4px;
  animation: fadeUp 0.8s 0.4s ease both;
}

.landing-footer {
  position: absolute;
  bottom: 32px;
  left: 8vw;
  font-size: 11px;
  color: var(--text-muted);
  z-index: 1;
  animation: fadeUp 0.8s 0.5s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile: stack vertically, show device below */
@media (max-width: 768px) {
  .hero {
    background-position: center bottom;
    background-size: 80%;
    align-items: flex-start;
    padding: 60px 24px 40vh;
  }
  .hero::before {
    background: linear-gradient(
      180deg,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.9) 50%,
      rgba(255,255,255,0.3) 75%,
      transparent 100%
    );
  }
  .hero-content {
    max-width: 100%;
  }
  .logo img {
    width: 60vw;
  }
  h1 { font-size: clamp(28px, 7vw, 40px); }
  .subtitle { font-size: 15px; }
  .landing-footer {
    left: 24px;
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-content">
    <div class="logo">
      <img src="Logo_Full.png" alt="AminoSense">
    </div>

    <h1>Amino acid detection,<br><em>reimagined.</em></h1>

    <p class="subtitle">Real-time amino acid quantification from a finger prick — at a fraction of the cost of current methods.</p>

    <div class="cta">
      <a href="mailto:matei@aminosense.bio?subject=Demo%20Request%20%E2%80%94%20AminoSense" class="btn btn-primary">Request a Demo</a>
      <a href="portal.html" class="btn btn-portal">Research Portal</a>
    </div>

    <div class="ruo">For Research Use Only</div>
  </div>

  <div class="landing-footer">
    <p>&copy; 2026 AminoSense, Inc.</p>
  </div>
</section>

</body>
</html>
