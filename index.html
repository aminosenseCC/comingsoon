<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aminosense — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(242, 201, 76, 0.05);
            font-family: 'Segoe UI Semilight', 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeUp 1.2s ease-out both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            max-width: 1000px;
            width: 85vw;
            margin-bottom: 48px;
        }

        .coming-soon {
            font-family: 'Segoe UI Semilight', 'Segoe UI', sans-serif;
            font-weight: 350;
            font-size: 1.6rem;
            letter-spacing: 0.45em;
            text-transform: uppercase;
            color: #000000;
            animation: fadeUp 1.2s ease-out 0.4s both;
        }

        .footer {
            position: absolute;
            bottom: 32px;
            text-align: center;
            animation: fadeUp 1.2s ease-out 0.6s both;
        }

        .footer p {
            font-family: 'Segoe UI', sans-serif;
            font-weight: 350;
            font-style: normal;
            font-size: 0.85rem;
            color: #000000;
            margin-bottom: 8px;
        }

        .footer img {
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Logo_Full.png" alt="aminosense" class="logo">
        <p class="coming-soon">Coming Soon</p>
    </div>
    <div class="footer">
        <p>Originated By:</p>
        <img src="CClogo.png" alt="CC Logo">
    </div>
</body>
</html>
